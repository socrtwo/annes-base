name: Release web build

# Tagging vX.Y.Z (or vX.Y.Z-dev.N) publishes a prerelease with the tested offline web build.
# Capacitor (Android, iOS) and Electron packages are not built yet.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - name: Package
        run: |
          cd dist
          zip -r "../annes-base-web-${GITHUB_REF_NAME}.zip" .
          cd ..
          sha256sum "annes-base-web-${GITHUB_REF_NAME}.zip" > "annes-base-web-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "annes-base-web-${GITHUB_REF_NAME}.zip" "annes-base-web-${GITHUB_REF_NAME}.zip.sha256" \
            --prerelease --title "Anne's Base ${GITHUB_REF_NAME} (web preview)" \
            --notes "Offline-capable web build. Unzip and serve the folder over HTTPS (any static host); relative paths are supported. Keep downloaded backups of your databases. Android, iOS and desktop packages are not built yet."
